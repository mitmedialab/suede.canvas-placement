[package]
name = "canvas_placement"
version = "0.1.0"
edition = "2021"
description = "Stateless drawing placement for doodlebot canvases (Rust, with a Python extension)"

[lib]
name = "canvas_placement"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# PyO3 extension module (built by maturin; see pyproject.toml).
python = ["dep:pyo3", "dep:pythonize"]
# `placement` binary: replay a JSON request from stdin.
cli = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
realfft = "3"
rustfft = "6"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"], optional = true }
pythonize = { version = "0.23", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "placement"
path = "src/bin/placement.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
